{% extends 'base.html' %}
{% block content %}

<div class="container py-4">

    <div class="mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h2 class="fw-semibold mb-0">{{ contract['salesorder_number'] }}</h2>
            <span class="text-muted">{{ contract['status'] | capitalize }}</span>
        </div>
        <a href="/contracts" class="btn btn-outline-secondary">← Back to Contracts</a>
    </div>

    <form method="POST" action="/contracts/{{ contract['salesorder_id'] }}/update">

        <!-- Contract Details -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Contract Details</h5>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Buyer</label>
                        <select class="form-select" name="buyer">
                            <option value="">-- Select Buyer --</option>
                            {% for customer in customers %}
                            <option value="{{ customer.customer_id }}" {% if contract[
                            'custom'].get('cf_buyer') == customer.customer_name %}selected{% endif %}>{{
                            customer.customer_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Seller</label>
                        <select class="form-select" name="seller">
                            <option value="">-- Select Seller --</option>
                            {% for customer in customers %}
                            <option value="{{ customer.customer_id }}" {% if contract[
                            'customer_id'] == customer.customer_id %}selected{% endif %}>{{ customer.customer_name
                            }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Commodity</label>
                        <select class="form-select" name="commodity">
                            <option value="">-- Select Commodity --</option>
                            {% for item in items %}
                            <option value="{{ item.item_id }}" {% if contract[
                            'line_items'] and contract['line_items'][0]['item_id'] == item.item_id %}selected{% endif
                            %}>{{ item.item_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Commodity Price (USD)</label>
                        <input type="number" step="0.01" class="form-control" name="commodity_rate"
                               value="{{ contract['custom'].get('cf_item_contract_price', '') }}">
                    </div>
                </div>
            </div>
        </div>

        <!-- Transportation Details -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Transportation Details</h5>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Transportation</label>
                        <select class="form-select" name="transportation">
                            <option value="">-- Select --</option>
                            {% for option in ['Barge', 'Container', 'Rail', 'Truck', 'Vessel', 'Consulting', 'Paper',
                            'Freight', 'Other'] %}
                            <option value="{{ option }}" {% if contract[
                            'custom'].get('cf_trnspname') == option %}selected{% endif %}>{{ option }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Vessel Name</label>
                        <input type="text" class="form-control" name="vessel_name"
                               value="{{ contract['custom'].get('cf_vessel_name', '') }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Expected Shipping Date</label>
                        <input type="date" class="form-control" name="shipping_date"
                               value="{{ contract.get('shipment_date', '') }}">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Delivery Notes</label>
                        <textarea class="form-control" rows="4"
                                  name="delivery_notes">{{ contract.get('notes', '') }}</textarea>
                    </div>
                </div>
            </div>
        </div>

        <!-- Commodity Details -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Commodity Details</h5>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Contract Date</label>
                        <input type="date" class="form-control" name="contract_date"
                               value="{{ contract.get('date', '') }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Commission Rate (USD)</label>
                        <input type="number" step="0.000000001" class="form-control" name="commission_rate"
                               value="{{ contract['line_items'][0]['rate'] if contract.get('line_items') else '' }}">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Quantity</label>
                        <input type="number" step="0.01" class="form-control" name="quantity"
                               value="{{ contract['line_items'][0]['quantity'] if contract.get('line_items') else '' }}">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">UOM</label>
                        <select class="form-select" name="uom">
                            <option value="">-- Select --</option>
                            {% for option in ['metric ton', 'bushel', 'short ton', 'consulting', 'other'] %}
                            <option value="{{ option }}" {% if contract[
                            'custom'].get('cf_uom') == option %}selected{% endif %}>{{ option }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Contract Terms</label>
                        <textarea class="form-control" rows="4" name="terms">{{ contract.get('terms', '') }}</textarea>
                    </div>
                </div>
            </div>
        </div>

        <!-- Co-Broker -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Co-Broker</h5>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Co Broker Name</label>
                        <input type="text" class="form-control" name="co_broker_name"
                               value="{{ contract['custom'].get('cf_co_broker', '') }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Co Brokerage Rate</label>
                        <input type="text" class="form-control" name="co_brokerage_rate"
                               value="{{ contract['custom'].get('cf_co_brokerage_rate', '') }}">
                    </div>
                </div>
            </div>
        </div>

        <!-- Contract Status -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Contract Status</h5>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Seller Reference Number</label>
                        <input type="text" class="form-control" name="seller_reference"
                               value="{{ contract['custom'].get('cf_customer_ref', '') }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Salesperson</label>
                        <input type="text" class="form-control" value="{{ contract.get('salesperson_name', '') }}"
                               readonly>
                    </div>
                </div>
            </div>
        </div>

        <!-- Submit -->
        <div class="d-flex gap-2 justify-content-end mb-5">
            <a href="/contracts" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-success">Save Changes</button>
        </div>

    </form>
</div>


<!-- Tasks Button -->
<button id="tasks-toggle" class="btn btn-success"
        style="position:fixed; bottom:2rem; right:2rem; z-index:3500; padding: 0.75rem 1.5rem;">
    Tasks ({{ tasks | selectattr('status', 'equalto', 'pending') | list | length }})
</button>

<!-- Task Overlay -->
<div id="task-overlay" style="display:none; position:fixed; inset:0; z-index:2000; pointer-events:none;">
</div>

<!-- Task Context Box -->
<div id="task-box"
     style="display:none; position:fixed; z-index:3000; background:#242422; border:1px solid #3a3a38; border-radius:10px; padding:1.25rem 1.5rem; width:280px; box-shadow: 0 4px 24px rgba(0,0,0,0.5);">
    <p style="color:#888780; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:0.25rem;"
       id="task-counter"></p>
    <p style="color:#d3d1c7; font-weight:500; margin-bottom:0.5rem;" id="task-title"></p>
    <p style="color:#888780; font-size:0.9rem; margin-bottom:1rem;" id="task-description"></p>
    <button id="task-confirm" class="btn btn-success w-100">Confirm</button>
</div>

<script>
    const tasks = {{ tasks | map(attribute='id') | list | tojson }};
    const taskData = {
        {% for task in tasks %}
        {{ task.id }}: {
            id: {{ task.id }},
            title: {{ task.template.title | tojson }},
            description: {{ task.template.description | tojson }},
            field: {{ task.template.books_field | tojson }},
            status: {{ task.status | tojson }}
        },
        {% endfor %}
    };

    let activeTaskIndex = 0;
    let walkthroughActive = false;

    function getFieldElement(fieldName) {
        return document.querySelector(`[name="${fieldName}"]`);
    }

function positionBox(fieldEl) {
    const rect = fieldEl.getBoundingClientRect();
    const box = document.getElementById('task-box');
    const margin = 20;
    const boxWidth = 280;

    box.style.display = 'block';

    // Try Right first
    let left = rect.right + margin;
    let top = rect.top; // Fixed position doesn't need window.scrollY if field is already in view

    // Flip to Left if no room on Right
    if (left + boxWidth > window.innerWidth) {
        left = rect.left - boxWidth - margin;
    }

    // Safety: don't let it go off the left edge
    left = Math.max(margin, left);

    box.style.left = left + 'px';
    box.style.top = top + 'px';
}


    function confirmTask(taskId, fieldEl) {
        const value = fieldEl.value || fieldEl.options?.[fieldEl.selectedIndex]?.value || '';
        fetch(`/tasks/${taskId}/confirm`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ completed_value: value })
        }).then(res => res.json()).then(data => {
            if (data.ok) {
                taskData[taskId].status = 'complete';
                updateTaskButton();
                showTask(0);
            }
        });
    }

   function showTask(index) {
    const currentPending = tasks.filter(id => taskData[id].status === 'pending');
    if (index >= currentPending.length) {
        exitWalkthrough();
        return;
    }

    const task = taskData[currentPending[index]];
    const fieldEl = getFieldElement(task.field);
    if (!fieldEl) {
        showTask(index + 1);
        return;
    }

    // 1. Scroll the field into view
    fieldEl.scrollIntoView({ behavior: 'smooth', block: 'center' });

    // 2. Wait for the scroll to finish (approx 300ms) before positioning
    setTimeout(() => {
        const rect = fieldEl.getBoundingClientRect();

        // Update the Highlight Overlay
        document.getElementById('task-overlay').style.cssText = `
            display:block;
            position:fixed;
            inset:0;
            z-index:2000;
            pointer-events:none;
            background: radial-gradient(ellipse ${rect.width + 40}px ${rect.height + 40}px at ${rect.left + rect.width / 2}px ${rect.top + rect.height / 2}px, transparent 40%, rgba(14,14,12,0.92) 70%);
        `;

        // Update Text
        document.getElementById('task-counter').textContent = `Task ${index + 1} of ${currentPending.length}`;
        document.getElementById('task-title').textContent = task.title;
        document.getElementById('task-description').textContent = task.description;

        // Position the Box
        positionBox(fieldEl);

        const confirmBtn = document.getElementById('task-confirm');
        confirmBtn.replaceWith(confirmBtn.cloneNode(true));
        document.getElementById('task-confirm').onclick = () => confirmTask(task.id, fieldEl);
    }, 350); // This delay is the secret sauce
}

    function updateTaskButton() {
        const remaining = tasks.filter(id => taskData[id].status === 'pending').length;
        document.getElementById('tasks-toggle').textContent = `Tasks (${remaining})`;
    }

    function exitWalkthrough() {
        walkthroughActive = false;
        document.getElementById('task-overlay').style.display = 'none';
        document.getElementById('task-box').style.display = 'none';
        document.body.style.overflow = '';
        activeTaskIndex = 0;
    }

    function enterWalkthrough() {
        document.body.style.overflow = 'hidden';
        walkthroughActive = true;
        activeTaskIndex = 0;
        showTask(activeTaskIndex);
    }

    document.getElementById('tasks-toggle').addEventListener('click', () => {
        if (walkthroughActive) {
            exitWalkthrough();
        } else {
            enterWalkthrough();
        }
    });
</script>

{% endblock %}
