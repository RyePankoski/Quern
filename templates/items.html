{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
    <h2 class="fw-semibold mb-4">Items</h2>
    <div class="table-responsive">
        <table class="table table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>ID</th>
                </tr>
            </thead>
            <tbody>
                {% for item in items %}
                <tr>
                    <td>{{ loop.index }}</td>
                    <td>{{ item.item_name }}</td>
                    <td class="d-none d-md-table-cell">{{ item.item_id }}</td>

                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
