{% extends 'base_login.html' %}
{% block content %}

<div style="display:flex; align-items:center; justify-content:center; min-height:100vh;">
    <div style="width:100%; max-width:360px;">

        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='img/logo_small.png') }}" height="60" class="mb-3">
            <p class="text-muted" style="font-size:0.85rem;">Sign in to continue</p>
        </div>

        <div class="card">
            <div class="card-body p-4">
                <form method="POST" action="/login">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" name="username" autofocus autocomplete="username">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-success w-100">Sign In</button>
                </form>
            </div>
        </div>

    </div>
</div>

{% endblock %}
