{% extends 'base_login.html' %}
{% block content %}

<div style="display:flex; align-items:center; justify-content:center; min-height:100vh;">
    <div style="width:100%; max-width:360px;">

        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='img/logo_small.png') }}" height="60" class="mb-3">
            <p class="text-muted" style="font-size:0.85rem;">You've been signed out of Quern.</p>
        </div>

        <div class="card">
            <div class="card-body p-4 text-center">
                <a href="/login" class="btn btn-success w-100" style="padding:0.75rem;">
                    Sign in again
                </a>
                <p class="text-muted mt-3 mb-0" style="font-size:0.75rem;">
                    Your Microsoft session is still active. Click above to return to Quern.
                </p>
            </div>
        </div>

    </div>
</div>

{% endblock %}
