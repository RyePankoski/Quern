<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quern</title>
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/android-chrome-512x512.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='img/favicon-16x16.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='img/site.webmanifest') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a18;
        }

        html, body {
            min-height: 100vh;
            background-color: #1a1a18;
        }

        .card {
            background-color: #242422;
            border-color: #3a3a38;
        }

        .card-header {
            background-color: #2c2c2a;
            border-color: #3a3a38;
        }

        .form-control {
            background-color: #2c2c2a;
            border-color: #3a3a38;
            color: #d3d1c7;
        }

        .form-control:focus {
            border-color: #4f7a1a;
            box-shadow: 0 0 0 0.2rem rgba(99,153,34,0.25);
            background-color: #2c2c2a;
            color: #d3d1c7;
        }

        .form-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.3rem;
            color: #888780;
        }

        .btn-success {
            background-color: #4f7a1a;
            border-color: #4f7a1a;
        }

        .btn-success:hover {
            background-color: #4f7a1a;
            border-color: #4f7a1a;
        }

        h2.fw-semibold {
            color: #4f7a1a;
        }
    </style>
</head>
<body>

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
{% for category, message in messages %}
<div class="alert alert-{{ category }} alert-dismissible fade show m-3" role="alert">
    {{ message }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
{% endfor %}
{% endif %}
{% endwith %}

{% block content %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
