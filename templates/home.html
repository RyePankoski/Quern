{% extends 'base.html' %}
{% block content %}

<style>
  .quern-wordmark {
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #6c757d;
    margin-top: 0.6rem;
    margin-bottom: 0;
    text-align: center;
  }

  .quern-divider {
    width: 40px;
    height: 1px;
    background: #adb5bd;
    opacity: 0.5;
    margin: 0.9rem auto 0;
  }

  .btn-new-contract {
    position: relative;
    overflow: hidden;
  }

  .btn-new-contract::after {
    content: '';
    position: absolute;
    top: 0;
    left: -75%;
    width: 50%;
    height: 100%;
    background: linear-gradient(
      120deg,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,0.35) 50%,
      rgba(255,255,255,0) 100%
    );
    animation: btn-shine 5s ease-in-out infinite;
  }

  @keyframes btn-shine {
    0%   { left: -75%; }
    40%  { left: 125%; }
    100% { left: 125%; }
  }
</style>

<div class="container d-flex flex-column align-items-center justify-content-center" style="min-height: 50vh;">

    <div class="mb-4 text-center">
        <img src="{{ url_for('static', filename='img/logo_small.png') }}"
             alt="Quern logo"
             style="max-width: 700px; width: 100%;">
        <p class="quern-wordmark">Contract Management</p>
        <div class="quern-divider"></div>
    </div>

    <div class="row g-3 w-100" style="max-width: 700px;">

        <div class="col-6">
            <a href="/new_contract" class="btn btn-success w-100 py-3 btn-new-contract">New Contract</a>
        </div>

        <div class="col-6">
            <a href="/contracts" class="btn btn-outline-secondary w-100 py-3">Contracts</a>
        </div>

        <div class="col-6">
            <a href="/tasks" class="btn btn-outline-secondary w-100 py-3">Tasks</a>
        </div>

        <div class="col-6">
            <a href="/counterparties" class="btn btn-outline-secondary w-100 py-3">Counterparties</a>
        </div>

        <div class="col-6">
            <a href="/items" class="btn btn-outline-secondary w-100 py-3">Items</a>
        </div>

        <div class="col-6">
            <a href="/employees" class="btn btn-outline-secondary w-100 py-3">Employees</a>
        </div>

    </div>

</div>

{% endblock %}
